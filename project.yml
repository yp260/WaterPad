name: WaterPad
options:
  bundleIdPrefix: com.water
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    # SWIFT_VERSION 只接受语言模式（4.0/4.2/5.0/6.0），5.9 会导致 xcodebuild 报错
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: "NO"
targets:
  WaterPad:
    type: application
    platform: iOS
    sources:
      - path: WaterPad
        excludes:
          - "Info.plist"
    # xcodegen 的 info 块必须给 path，由 xcodegen 生成 Info.plist 并自动设置
    # INFOPLIST_FILE；properties 里的键会写进生成的 plist。
    info:
      path: WaterPad/Info.plist
      properties:
        CFBundleDisplayName: WaterPad
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
          - bluetooth-le
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 刻意不声明 UIBackgroundModes：本应用必须前台常亮，后台模式无用；
        # 免费 Apple ID 侧载时某些后台模式会触发 entitlement 校验，导致应用点开即退。
        # 此结论来自并行项目 PocketTrackpad v0.0.2 的真机闪退修复。
        NSBluetoothAlwaysUsageDescription: "需要蓝牙权限，才能把虚拟手柄输入发送给主机"
        NSBluetoothPeripheralUsageDescription: "需要蓝牙权限，才能把虚拟手柄输入发送给主机"
        ITSAppUsesNonExemptEncryption: false
        UIViewControllerBasedStatusBarAppearance: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.water.WaterPad
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
