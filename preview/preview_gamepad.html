<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>WaterPad 主界面预览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: #2b2b2e;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  /* 设备外框：横屏 iPhone */
  .device {
    width: 960px; height: 446px;
    background: #0a0a0a;
    border-radius: 52px;
    padding: 14px;
    box-shadow: 0 30px 70px rgba(0,0,0,.55), inset 0 0 0 2px #2a2a2c;
    position: relative;
  }
  /* 刘海（横屏在右侧） */
  .notch {
    position: absolute; top: 50%; right: 14px; transform: translateY(-50%);
    width: 26px; height: 150px; background: #000; border-radius: 16px; z-index: 5;
  }
  .screen {
    width: 100%; height: 100%;
    background: #000; border-radius: 40px; overflow: hidden;
    display: flex; flex-direction: column;
    color: #fff;
  }
  /* 状态栏 */
  .statusbar {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 18px; min-height: 36px;
    font-size: 12px; color: #fff;
    background: #0c0c0d;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #34c759; }
  .dot.off { background: #ff9f0a; }
  .statusbar .sub { color: #98989d; }
  .spacer { flex: 1; }
  .btn {
    border: 1px solid #3a3a3c; background: #1c1c1e; color: #fff;
    border-radius: 8px; padding: 4px 10px; font-size: 12px;
  }
  .btn.accent { border-color: #0a84ff33; color: #0a84ff; }
  .divider { height: 1px; background: #2c2c2e; }
  /* 手柄区 */
  .gamepad {
    flex: 1; display: flex; align-items: center; justify-content: space-between;
    padding: 6px 26px; gap: 8px;
  }
  .cluster { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; align-items: center; gap: 12px; }
  .center { max-width: 200px; align-items: center; }
  /* 小按钮（肩键/功能键） */
  .padbtn {
    width: 40px; height: 34px; min-width: 40px; padding: 0 5px; border-radius: 9px;
    background: #2c2c2e; border: 1px solid #444446;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: #f2f2f7; font-weight: 600;
  }
  .padbtn.pressed { background: #0a84ff; border-color: #0a84ff; color: #fff; }
  /* 摇杆 */
  .stick {
    width: 96px; height: 96px; border-radius: 50%;
    background: radial-gradient(circle at 50% 40%, #3a3a3c, #161618);
    border: 2px solid #4a4a4c; position: relative;
    box-shadow: inset 0 4px 10px rgba(0,0,0,.6);
  }
  .stick .thumb {
    position: absolute; left: 50%; top: 50%; width: 44px; height: 44px;
    border-radius: 50%; transform: translate(-50%,-50%);
    background: radial-gradient(circle at 50% 35%, #6a6a6e, #2a2a2c);
    box-shadow: 0 2px 6px rgba(0,0,0,.5);
  }
  .stick-label { text-align: center; font-size: 10px; color: #98989d; margin-top: 2px; }
  /* 十字键 */
  .dpad { position: relative; width: 96px; height: 96px; }
  .dpad .arm { position: absolute; background: #2c2c2e; border: 1px solid #444446; }
  .dpad .h { left: 8px; top: 34px; width: 80px; height: 28px; border-radius: 6px; }
  .dpad .v { top: 8px; left: 34px; width: 28px; height: 80px; border-radius: 6px; }
  .dpad .cap { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: 28px; height: 28px; border-radius: 6px; background: #1c1c1e; border: 1px solid #444446; }
  /* 面键簇 */
  .face { position: relative; width: 128px; height: 128px; }
  .face .fb {
    position: absolute; left: 50%; top: 50%; width: 44px; height: 44px;
    margin: -22px 0 0 -22px; border-radius: 50%;
    background: #2c2c2e; border: 1px solid #444446;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700; color: #f2f2f7;
  }
  .face .n { transform: translateY(-40px); }
  .face .s { transform: translateY(40px); }
  .face .w { transform: translateX(-40px); }
  .face .e { transform: translateX(40px); }
  /* 滑块 */
  .slider { width: 180px; }
  .slider .lab { display: flex; justify-content: space-between; font-size: 10px; color: #98989d; margin-bottom: 2px; }
  .track { height: 6px; border-radius: 3px; background: #3a3a3c; position: relative; }
  .track .fill { position: absolute; left: 0; top: 0; height: 100%; border-radius: 3px;
    background: linear-gradient(90deg,#0a84ff,#5ac8fa); width: 35%; }
  .title { font-size: 11px; color: #98989d; text-align: center; margin: 2px 0 0; }
  .reset { border: 1px solid #3a3a3c; background: #1c1c1e; color: #fff; border-radius: 8px;
    padding: 4px 12px; font-size: 11px; margin-top: 2px; }
</style>
</head>
<body>
  <div class="device">
    <div class="notch"></div>
    <div class="screen">
      <div class="statusbar">
        <span class="dot"></span>
        <span>广播中</span>
        <span class="sub">蓝牙：已开启</span>
        <span class="sub" style="color:#34c759">已连接 1 台</span>
        <span class="sub">通用手柄</span>
        <span class="spacer"></span>
        <span class="btn">停止广播</span>
        <span class="btn">日志</span>
        <span class="btn accent">设置</span>
      </div>
      <div class="divider"></div>
      <div class="gamepad">
        <!-- 左簇 -->
        <div class="cluster">
          <div class="row">
            <div class="padbtn">LB</div>
            <div class="padbtn">LT</div>
          </div>
          <div class="row">
            <div class="dpad">
              <div class="arm h"></div><div class="arm v"></div><div class="cap"></div>
            </div>
            <div>
              <div class="stick"><div class="thumb"></div></div>
              <div class="stick-label">左摇杆</div>
            </div>
          </div>
        </div>
        <!-- 中簇 -->
        <div class="cluster center">
          <div class="row">
            <div class="padbtn">Back</div>
            <div class="padbtn">Home</div>
            <div class="padbtn">Start</div>
          </div>
          <div class="slider">
            <div class="lab"><span>LT（左扳机）</span><span>35%</span></div>
            <div class="track"><div class="fill" style="width:35%"></div></div>
          </div>
          <div class="slider">
            <div class="lab"><span>RT（右扳机）</span><span>20%</span></div>
            <div class="track"><div class="fill" style="width:20%"></div></div>
          </div>
          <div class="row">
            <div class="padbtn">L3</div>
            <div class="padbtn">R3</div>
            <div class="padbtn">Share</div>
          </div>
          <p class="title">通用手柄</p>
          <div class="reset">全部松开</div>
        </div>
        <!-- 右簇 -->
        <div class="cluster">
          <div class="row">
            <div class="padbtn">RB</div>
            <div class="padbtn">RT</div>
          </div>
          <div class="row">
            <div>
              <div class="stick"><div class="thumb" style="transform:translate(-30%,-60%)"></div></div>
              <div class="stick-label">右摇杆</div>
            </div>
            <div class="face">
              <div class="fb n">4</div>
              <div class="fb w">3</div>
              <div class="fb e">2</div>
              <div class="fb s">1</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
