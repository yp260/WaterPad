name: WaterPad
options:
  bundleIdPrefix: com.water
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    # SWIFT_VERSION 只接受语言模式（4.0/4.2/5.0/6.0），5.9 会导致 xcodebuild 报错
    SWIFT_VERSION: "5.0"
    # 1 = iPhone，2 = iPad。必须同时支持 iPad：只写 1 时 App 在 iPad 上
    # 以 iPhone 兼容模式运行（缩放的小窗口），手柄区被压扁，布局编辑几乎不可用。
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: "NO"
targets:
  WaterPad:
    type: application
    platform: iOS
    sources:
      - path: WaterPad
        excludes:
          - "Info.plist"
    # xcodegen 的 info 块必须给 path，由 xcodegen 生成 Info.plist 并自动设置
    # INFOPLIST_FILE；properties 里的键会写进生成的 plist。
    info:
      path: WaterPad/Info.plist
      properties:
        CFBundleDisplayName: WaterPad
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
          - bluetooth-le
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPad 上锁定全屏，避免分屏/台前调度把手柄区切成窄条，
        # 那样控件位置会随窗口尺寸漂移，用户调好的布局就白调了。
        UIRequiresFullScreen: true
        # 刻意不声明 UIBackgroundModes：本应用必须前台常亮，后台模式无用；
        # 免费 Apple ID 侧载时某些后台模式会触发 entitlement 校验，导致应用点开即退。
        # 此结论来自并行项目 PocketTrackpad v0.0.2 的真机闪退修复。
        NSBluetoothAlwaysUsageDescription: "需要蓝牙权限，才能把虚拟手柄输入发送给主机"
        NSBluetoothPeripheralUsageDescription: "需要蓝牙权限，才能把虚拟手柄输入发送给主机"
        # CMMotionManager 读取运动数据按惯例声明用途文案，避免未来系统版本弹窗缺失
        NSMotionUsageDescription: "需要访问运动传感器，才能把陀螺仪与加速度数据发送给主机"
        ITSAppUsesNonExemptEncryption: false
        UIViewControllerBasedStatusBarAppearance: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.water.WaterPad
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
